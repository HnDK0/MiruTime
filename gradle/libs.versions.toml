[versions]
# Mirrored from MiruTime-Core (do not invent: keep in sync with core).
kotlin = "2.4.20"
agp = "9.4.0"
coroutines = "1.11.0"
# Same release as the core artifact (kept as a separate ref).
coroutinesTest = "1.11.0"
serialization = "1.12.0"
# Stable releases: Compose BOM 2026.09.00, navigation 2.10.2, activity 1.12.3.
composeBom = "2026.09.00"
navigation = "2.10.2"
activity = "1.12.3"
# coil-compose 3.6.3 and palette 1.0.0 are the current stable releases.
coil3 = "3.6.3"
palette = "1.0.0"
# Tiled manga viewer (same release as the NoveLA reference).
subsampling-scale-image-view = "3.10.0"
# 2.12.0 is the current stable release of androidx.work:work-runtime-ktx.
work = "2.12.0"
# Window insets/controller compat used by the extracted reader fullscreen UI;
# matches the version the app already resolves.
core = "1.18.0"
junit = "4.13.2"
# Instrumentation test stack (cache-verified versions).
androidxTest = "1.7.0"
androidxTestExtJunit = "1.3.0"
ktor = "3.6.1"
ksoup = "0.2.6"
luaj-jse = "3.0.1"
okio = "3.18.2"
snakeyaml = "2.7"
# CVE-2026-111497 ("Brotli2Shell") is an out-of-bounds write in the C decoder
# (Google Brotli 1.0.3-1.2.0). This is the pure-Java port: Java array bounds
# throw instead of corrupting native memory, 0.1.2 is its latest release and
# OSV-clean, and decoded bodies are capped after ContentEncoding by
# BodySizeLimiter (25 MB plugin / 16 MB image / 5 MB repo). No fixed version
# exists to move to, and none is needed.
brotli-dec = "0.1.2"
# Room KMP stack: Room3 3.0.3, KSP 2.3.12 (KSP2-only, works with Kotlin
# 2.4.20), sqlite-bundled 2.7.1.
room3 = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.12"
# Video player: media3 1.11.1 and OkHttp 5.5.1; media3-datasource-okhttp
# needs the same media3.
media3 = "1.11.1"
okhttp = "5.5.1"

[libraries]
# App (Compose UI).
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil3" }
coil-network-core = { module = "io.coil-kt.coil3:coil-network-core", version.ref = "coil3" }
palette = { module = "androidx.palette:palette", version.ref = "palette" }
subsampling-scale-image-view = { module = "com.davemorrissey.labs:subsampling-scale-image-view", version.ref = "subsampling-scale-image-view" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# Library modules (mirutime-core / translator).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
luaj-jse = { module = "org.luaj:luaj-jse", version.ref = "luaj-jse" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
brotli-dec = { module = "org.brotli:dec", version.ref = "brotli-dec" }
# Room KMP data layer.
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
# Video player (app-only; no background service, so no media3-session).
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }
