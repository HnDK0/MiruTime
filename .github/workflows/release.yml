name: Release by tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags are needed to diff the release against the
          # previous stable tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Set up signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > app/storeFile.jks
          cat > "$GITHUB_WORKSPACE/custom.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/app/storeFile.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set build metadata
        run: echo "CORE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          chmod +x gradlew
          # Same full gate as CI (AGENTS §1) before the release build.
          ./gradlew --no-daemon --build-cache --parallel \
            :core-reader-model:test \
            :ui-kit:testDebugUnitTest :ui-kit:lintDebug \
            :core-log:testDebugUnitTest :core-log:lintDebug \
            :feature-tts:testDebugUnitTest :feature-tts:lintDebug \
            :feature-reader:testDebugUnitTest :feature-reader:lintDebug \
            :mirutime-core:jvmTest :mirutime-data:jvmTest :translator:jvmTest \
            :image-loader:testDebugUnitTest :image-loader:lintDebug \
            :app:testDebugUnitTest :app:lintDebug \
            :app:assembleRelease \
            :mirutime-core:publishToMavenLocal \
            -PabiSplits=true \
            -Pgroup=com.github.HnDK0.MiruTime \
            -Pversion="$CORE_VERSION" \
            -PlocalPropertiesFilePath="$GITHUB_WORKSPACE/custom.properties"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "release-artifacts/MiruTime-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk \
            "release-artifacts/MiruTime-${GITHUB_REF_NAME}-universal.apk"
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then
            gzip -9 -c "$mapping" > "release-artifacts/mapping-${GITHUB_SHA::7}.txt.gz"
          else
            echo "::warning::R8 mapping.txt is missing; this release ships without a deobfuscation mapping"
          fi

          core_repo="$HOME/.m2/repository/com/github/HnDK0/MiruTime"
          core_jvm="$core_repo/mirutime-core-jvm/$CORE_VERSION/mirutime-core-jvm-$CORE_VERSION.jar"
          core_android="$core_repo/mirutime-core-android/$CORE_VERSION/mirutime-core-android-$CORE_VERSION.aar"
          test -f "$core_jvm"
          test -f "$core_android"
          cp "$core_jvm" "release-artifacts/mirutime-core-jvm-${CORE_VERSION}.jar"
          cp "$core_android" "release-artifacts/mirutime-core-android-${CORE_VERSION}.aar"
          (cd "$HOME/.m2/repository" && \
            zip -qr "$GITHUB_WORKSPACE/release-artifacts/mirutime-core-maven-${CORE_VERSION}.zip" \
              "com/github/HnDK0/MiruTime")
          ls -lah release-artifacts

      - name: Verify APKs
        run: |
          set -euo pipefail
          # Release build-tools only: an installed rc/preview sorts above the
          # stable version and would otherwise be picked here.
          build_tools=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | grep -vE -- '-(rc|beta|alpha|preview)' | sort -V | tail -1)
          apks=$(find release-artifacts -maxdepth 1 -name 'MiruTime-*.apk' | sort)
          test "$(printf '%s\n' "$apks" | wc -l)" -eq 2
          # Pinned release certificate (DN O=Haokin Code) behind SIGNING_KEY;
          # do not rotate it silently: a re-signed app cannot update an
          # installed one.
          expected_sha256=d7a5a988519c725e61fcad57c2b3c969f8277c8ce58893f61559c489691ed21d
          for spec in "arm64-v8a:arm64-v8a" "universal:arm64-v8a armeabi-v7a x86 x86_64"; do
            name=${spec%%:*}
            expected_abis=${spec#*:}
            apk=$(printf '%s\n' "$apks" | grep -E -- "-${name}\.apk$")
            test -n "$apk"
            certs=$("$build_tools/apksigner" verify --print-certs "$apk")
            printf '%s\n' "$certs"
            # apksigner prints either "Signer #1 certificate SHA-256 digest: ..."
            # or "V2 Signer: certificate SHA-256 digest: ..." depending on version.
            actual_sha256=$(printf '%s\n' "$certs" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -1 | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -z "$actual_sha256" ]; then
              echo "::error::$apk: could not read the certificate digest from apksigner output"
              exit 1
            fi
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "::error::$apk certificate does not match the expected release certificate (SHA-256 $expected_sha256)"
              exit 1
            fi
            native_abis=$(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
            if [ "$native_abis" != "$expected_abis " ]; then
              echo "::error::$apk has ABIs '$native_abis', expected '$expected_abis '"
              exit 1
            fi
          done

      - name: Build release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force --quiet

          # Baseline = newest stable tag reachable from this commit, excluding
          # the tag being released right now.
          PREV_TAG=$(git tag --sort=-v:refname --merged HEAD \
            | grep -E '^v[0-9]' | grep -vx "$TAG" | head -n1 || true)

          if [ -n "$PREV_TAG" ]; then
            git log --no-merges --pretty=format:'- %s (%h)' "$PREV_TAG..HEAD"
          else
            git log --no-merges -20 --pretty=format:'- %s (%h)' HEAD
          fi > "$RUNNER_TEMP/commits.raw"

          # Release chores are bookkeeping, not changes worth announcing.
          grep -vE -- '^- (chore\(release\):|Merge )' "$RUNNER_TEMP/commits.raw" \
            > "$RUNNER_TEMP/commits.txt" || true

          # Prints a section only when the group has commits.
          section() {
            local title=$1; shift
            local lines
            lines=$("$@" || true)
            if [ -n "$lines" ]; then
              printf '### %s\n\n%s\n\n' "$title" "$lines"
            fi
          }

          # One language's changelog: four localized section titles.
          groups() {
            local commits=$RUNNER_TEMP/commits.txt
            if [ ! -s "$commits" ]; then
              return 0
            fi
            section "$1" grep -E -- '^- feat(\(|:)' "$commits"
            section "$2" grep -E -- '^- fix(\(|:)' "$commits"
            section "$3" grep -E -- '^- perf(\(|:)' "$commits"
            section "$4" awk '!/^- (feat|fix|perf)(\(|:)/' "$commits"
          }

          {
            echo "<div align=\"center\">"
            echo "<img src=\"https://github.com/${GITHUB_REPOSITORY}/raw/main/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png\" width=\"88\" height=\"88\" alt=\"MiruTime\"/>"
            echo
            echo "# MiruTime $TAG"
            echo
            echo "Reader for novels, manga and video"
            echo "</div>"
            echo
            # Each language block is self-contained: no mixed-language lines.
            echo "<details>"
            echo "<summary><b>🇷🇺 Русская версия</b></summary>"
            echo
            echo "> 🤖 Список изменений собран автоматически из сообщений коммитов, поэтому он может быть неполным или слишком техническим."
            echo
            echo "> ⚠️ Перед обновлением сделайте бэкап библиотеки: миграции Room необратимы."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Изменения с \`$PREV_TAG\`:"
            else
              echo "Первая сборка: последние изменения."
            fi
            echo
            if [ -s "$RUNNER_TEMP/commits.txt" ]; then
              groups "✨ Новое" "🐛 Исправления" "⚡ Производительность" "🧹 Прочее"
            else
              echo "_Нет изменений в коде._"
              echo
            fi
            echo "## Артефакты"
            echo
            echo "- \`MiruTime-${TAG}-arm64-v8a.apk\` — для современных 64-битных устройств (большинство телефонов); это обычная загрузка."
            echo "- \`MiruTime-${TAG}-universal.apk\` — для x86_64 (эмуляторы, Chromebooks, WSA) и 32-битных устройств; содержит все четыре ABI, поэтому больше по размеру."
            echo "- \`mirutime-core-maven-${CORE_VERSION}.zip\` — Maven-репозиторий с core JVM JAR и Android AAR для plugin tester."
            echo "- \`mirutime-core-jvm-${CORE_VERSION}.jar\`, \`mirutime-core-android-${CORE_VERSION}.aar\` — core без Maven-обёртки."
            echo "- R8 mapping — для деобфускации стектрейсов."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "[Полный список изменений](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG})."
              echo
            fi
            echo "</details>"
            echo
            echo "<details open>"
            echo "<summary><b>🇬🇧 English version</b></summary>"
            echo
            echo "> 🤖 The changelog is generated automatically from commit messages, so it may be incomplete or too technical."
            echo
            echo "> ⚠️ Back up the library before upgrading; Room migrations are one-way."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`$PREV_TAG\`:"
            else
              echo "Initial release: recent changes."
            fi
            echo
            if [ -s "$RUNNER_TEMP/commits.txt" ]; then
              groups "✨ New" "🐛 Fixes" "⚡ Performance" "🧹 Other"
            else
              echo "_No code changes._"
              echo
            fi
            echo "## Artifacts"
            echo
            echo "- \`MiruTime-${TAG}-arm64-v8a.apk\` — for modern 64-bit devices (most phones); this is the normal download."
            echo "- \`MiruTime-${TAG}-universal.apk\` — for x86_64 targets (emulators, Chromebooks, WSA) and 32-bit-only devices; it contains all four ABIs, so it is larger."
            echo "- \`mirutime-core-maven-${CORE_VERSION}.zip\` — Maven repository with the core JVM JAR and Android AAR for the plugin tester."
            echo "- \`mirutime-core-jvm-${CORE_VERSION}.jar\`, \`mirutime-core-android-${CORE_VERSION}.aar\` — raw core artifacts."
            echo "- R8 mapping — for deobfuscating crash stack traces."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "[Full changelog](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG})."
              echo
            fi
            echo "</details>"
            echo
            echo "<!-- Draft: add release highlights, screenshots and known issues before publishing. -->"
          } > "$RUNNER_TEMP/release-body.md"

          cat "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MiruTime ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: release-artifacts/*
          body_path: ${{ runner.temp }}/release-body.md
