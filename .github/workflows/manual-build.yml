name: Manual nightly build

# Deliberately workflow_dispatch only: there is no push or schedule trigger.
# Start it manually from the Actions page when a nightly is wanted. The
# nightly tag and release are global, so only the default branch may publish.
on:
  workflow_dispatch:

permissions:
  contents: write

# The nightly tag and release are shared by every run, so runs must be
# serialized even when dispatched from different refs. Never cancel: a
# half-finished run can leave a moved tag with missing assets.
concurrency:
  group: manual-nightly
  cancel-in-progress: false

jobs:
  build:
    name: Signed nightly artifact
    # workflow_dispatch can target any branch; only main may publish nightly.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history is required for the changelog (git log between tags)
          # and for force-moving the nightly tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Set up signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > app/storeFile.jks
          cat > "$GITHUB_WORKSPACE/custom.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/app/storeFile.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set build metadata
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$APP_VERSION" ]; then
            echo "::warning::versionName not found in app/build.gradle.kts; using 'dev'"
            APP_VERSION=dev
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          # Maven version of the core artifact: unique per nightly build.
          echo "CORE_VERSION=$APP_VERSION-$SHORT_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          # Same full gate as CI (AGENTS §1) before the release build.
          ./gradlew --no-daemon --build-cache --parallel \
            :core-reader-model:test \
            :ui-kit:testDebugUnitTest :ui-kit:lintDebug \
            :core-log:testDebugUnitTest :core-log:lintDebug \
            :feature-tts:testDebugUnitTest :feature-tts:lintDebug \
            :feature-reader:testDebugUnitTest :feature-reader:lintDebug \
            :mirutime-core:jvmTest :mirutime-data:jvmTest :translator:jvmTest \
            :image-loader:testDebugUnitTest :image-loader:lintDebug \
            :app:testDebugUnitTest :app:lintDebug \
            :app:assembleRelease \
            :mirutime-core:publishToMavenLocal \
            -PabiSplits=true \
            -Pgroup=com.github.HnDK0.MiruTime \
            -Pversion="$CORE_VERSION" \
            -PlocalPropertiesFilePath="$GITHUB_WORKSPACE/custom.properties"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            "release-artifacts/MiruTime-${SHORT_SHA}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk \
            "release-artifacts/MiruTime-${SHORT_SHA}-universal.apk"
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$mapping" ]; then
            echo "::error::R8 mapping.txt is missing; nightly cannot ship without deobfuscation mapping"
            exit 1
          fi
          gzip -9 -c "$mapping" > "release-artifacts/mapping-${SHORT_SHA}.txt.gz"

          # Publishable core for the plugin tester: raw JAR/AAR plus a Maven
          # repository layout so POMs and transitive dependencies are kept.
          core_repo="$HOME/.m2/repository/com/github/HnDK0/MiruTime"
          core_jvm="$core_repo/mirutime-core-jvm/$CORE_VERSION/mirutime-core-jvm-$CORE_VERSION.jar"
          core_android="$core_repo/mirutime-core-android/$CORE_VERSION/mirutime-core-android-$CORE_VERSION.aar"
          test -f "$core_jvm"
          test -f "$core_android"
          cp "$core_jvm" "release-artifacts/mirutime-core-jvm-${CORE_VERSION}.jar"
          cp "$core_android" "release-artifacts/mirutime-core-android-${CORE_VERSION}.aar"
          (cd "$HOME/.m2/repository" && \
            zip -qr "$GITHUB_WORKSPACE/release-artifacts/mirutime-core-maven-${CORE_VERSION}.zip" \
              "com/github/HnDK0/MiruTime")
          ls -lah release-artifacts

      - name: Verify APKs
        run: |
          set -euo pipefail
          # Release build-tools only: an installed rc/preview sorts above the
          # stable version and would otherwise be picked here.
          build_tools=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | grep -vE -- '-(rc|beta|alpha|preview)' | sort -V | tail -1)
          apks=$(find release-artifacts -maxdepth 1 -name 'MiruTime-*.apk' | sort)
          test "$(printf '%s\n' "$apks" | wc -l)" -eq 2
          # Pinned release certificate (DN O=Haokin Code) behind SIGNING_KEY;
          # do not rotate it silently: a re-signed app cannot update an
          # installed one.
          expected_sha256=d7a5a988519c725e61fcad57c2b3c969f8277c8ce58893f61559c489691ed21d
          for spec in "arm64-v8a:arm64-v8a" "universal:arm64-v8a armeabi-v7a x86 x86_64"; do
            name=${spec%%:*}
            expected_abis=${spec#*:}
            apk=$(printf '%s\n' "$apks" | grep -E -- "-${name}\.apk$")
            test -n "$apk"
            certs=$("$build_tools/apksigner" verify --print-certs "$apk")
            printf '%s\n' "$certs"
            # apksigner prints either "Signer #1 certificate SHA-256 digest: ..."
            # or "V2 Signer: certificate SHA-256 digest: ..." depending on version.
            actual_sha256=$(printf '%s\n' "$certs" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -1 | tr -d '\r' | tr '[:upper:]' '[:lower:]' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            if [ -z "$actual_sha256" ]; then
              echo "::error::$apk: could not read the certificate digest from apksigner output"
              exit 1
            fi
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "::error::$apk certificate does not match the expected release certificate (SHA-256 $expected_sha256)"
              exit 1
            fi
            native_abis=$(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | tr '\n' ' ')
            if [ "$native_abis" != "$expected_abis " ]; then
              echo "::error::$apk has ABIs '$native_abis', expected '$expected_abis '"
              exit 1
            fi
          done

      - name: Upload manual artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiruTime-nightly-${{ github.sha }}
          path: release-artifacts/
          retention-days: 14

      - name: Build changelog
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin --tags --force

          # Baseline = newest reachable stable tag (v*). Without one, diff
          # against the previous nightly commit so the notes follow recent
          # work instead of a fixed window.
          STABLE_TAG=$(git tag --sort=-v:refname --merged "$COMMIT_SHA" \
            | grep -E '^v[0-9]' | head -n1 || true)
          PREV_NIGHTLY=$(git rev-parse -q --verify 'nightly^{commit}' || true)

          BASE_REF=""
          BASE_LABEL=""
          if [ -n "$STABLE_TAG" ]; then
            BASE_REF="$STABLE_TAG"
            BASE_LABEL="Changes since $STABLE_TAG"
          elif [ -n "$PREV_NIGHTLY" ] && [ "$PREV_NIGHTLY" != "$COMMIT_SHA" ] \
               && git merge-base --is-ancestor "$PREV_NIGHTLY" "$COMMIT_SHA"; then
            BASE_REF="$PREV_NIGHTLY"
            BASE_LABEL="Changes since previous nightly ($(git rev-parse --short "$PREV_NIGHTLY"))"
          fi

          {
            echo "Automated build from the latest commit on the \`$REF_NAME\` branch."
            echo "Commit: $COMMIT_SHA"
            echo "This is not a stable release and may contain bugs."
            echo ""
            echo "⚠️ A Room migration may happen: back up the library before updating;"
            echo "rolling back to an older version may not work."
            echo ""
            echo "- \`MiruTime-${SHORT_SHA}-arm64-v8a.apk\` — for modern 64-bit devices (most phones); this is the normal download."
            echo "- \`MiruTime-${SHORT_SHA}-universal.apk\` — for x86_64 targets (Android emulators, Chromebooks, Windows Subsystem for Android) and 32-bit-only devices; it contains all four ABIs, so it is larger."
            echo "- \`mirutime-core-maven-${CORE_VERSION}.zip\` — Maven repository with the core JVM JAR and Android AAR for the plugin tester (it fetches this automatically)."
            echo "- \`mirutime-core-jvm-${CORE_VERSION}.jar\`, \`mirutime-core-android-${CORE_VERSION}.aar\` — raw core artifacts."
            echo ""
            if [ -n "$BASE_REF" ]; then
              echo "## $BASE_LABEL"
              CHANGES=$(git log --no-merges --pretty=format:'- %s (%h)' "$BASE_REF".."$COMMIT_SHA")
              if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- No code changes since the previous build."; fi
            else
              echo "## Recent changes"
              git log --no-merges -20 --pretty=format:'- %s (%h)' "$COMMIT_SHA"
            fi
            echo ""
          } > "$RUNNER_TEMP/release-body.md"

          cat "$RUNNER_TEMP/release-body.md"

      - name: Create/update nightly release
        uses: softprops/action-gh-release@v3
        with:
          # Publish the assets first; the tag is moved in the next step only
          # after this succeeds.
          name: MiruTime nightly v${{ env.APP_VERSION }} (${{ env.SHORT_SHA }})
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          body_path: ${{ runner.temp }}/release-body.md
          files: release-artifacts/*

      - name: Move nightly tag
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Source archives and the release must point at the built commit.
          git tag -f nightly "$COMMIT_SHA"
          git push origin nightly --force

      - name: Delete stale nightly APK assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SHORT_SHA"
          test -n "$CORE_VERSION"
          # Keep only the APK pair and core artifacts from this run; older
          # mappings stay so crashes from previous nightlies can still be
          # deobfuscated.
          if ! assets=$(gh release view nightly --json assets 2>&1); then
            if printf '%s' "$assets" | grep -qi 'not found'; then
              echo "nightly release does not exist yet; nothing to delete"
              exit 0
            fi
            printf '%s\n' "$assets" >&2
            exit 1
          fi
          names=$(printf '%s' "$assets" | jq -r '.assets[].name')
          stale=$(
            {
              printf '%s\n' "$names" | grep -E '\.apk$' | grep -vF -- "-${SHORT_SHA}-" || true
              printf '%s\n' "$names" | grep -E '^mirutime-core-.*\.(jar|aar|zip)$' \
                | grep -vF -- "-${CORE_VERSION}." || true
            } | sort -u
          )
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale" | xargs -r -I{} gh release delete-asset nightly "{}" --yes
          fi

      - name: Prune old mapping assets (keep last 20)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the 20 most recent mapping-<sha>.txt.gz; older ones no longer
          # need deobfuscation because their builds are long gone.
          if ! assets=$(gh release view nightly --json assets 2>&1); then
            if printf '%s' "$assets" | grep -qi 'not found'; then
              echo "nightly release does not exist yet; nothing to prune"
              exit 0
            fi
            printf '%s\n' "$assets" >&2
            exit 1
          fi
          stale=$(printf '%s' "$assets" | jq -r \
            '(.assets | map(select(.name | test("^mapping-.*\\.txt\\.gz$"))) | sort_by(.createdAt)) as $m
             | ($m | length) as $n
             | if $n > 20 then $m[0:($n - 20)][].name else empty end')
          if [ -n "$stale" ]; then
            printf '%s\n' "$stale" | xargs -r -I{} gh release delete-asset nightly "{}" --yes
          fi
